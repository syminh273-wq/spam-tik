name: Build desktop agent

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-mac-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-mac-

      - name: Install npm deps
        run: |
          if [ ! -d node_modules ]; then
            npm install --no-audit --no-fund
          fi

      - name: Build macOS
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-spam-agent-macos
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-win-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-win-

      - name: Install npm deps
        shell: bash
        run: |
          if [ ! -d node_modules ]; then
            npm install --no-audit --no-fund
          fi

      - name: Build Windows
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-spam-agent-windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: [build-mac, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.dmg artifacts/**/*.exe
          generate_release_notes: true